<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Automotriz · Noticias de la industria</title>
<meta name="description" content="Dashboard de noticias de la industria automotriz, con prioridad en Argentina y cobertura global. Se actualiza a diario.">
<style>
  :root {
    --bg: #121316;
    --bg-soft: #181a1f;
    --card: #15171b;
    --line: #252830;
    --line-strong: #3f4450;
    --txt: #eeeff2;
    --txt-dim: #a6abb6;
    --txt-mute: #707684;
    --accent: #eeeff2;
    --on-accent: #121316;
    --brand: #6297e6;
    --ar: #5ba2db;
    --global: #4ba375;
    --deporte: #e05353;
    --radius: 6px;
    --serif: Georgia, "Times New Roman", Times, serif;
    --sans: "Segoe UI", Inter, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  }
  html[data-theme="light"] {
    --bg: #ffffff;
    --bg-soft: #f5f5f3;
    --card: #ffffff;
    --line: #e3e5e8;
    --line-strong: #17181c;
    --txt: #141619;
    --txt-dim: #454952;
    --txt-mute: #787f8c;
    --accent: #141619;
    --on-accent: #ffffff;
    --brand: #2b5db8;
    --ar: #1d5fb5;
    --global: #1e7e4e;
    --deporte: #b91c1c;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--txt);
    font-family: var(--sans);
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1360px; margin: 0 auto; padding: 0 24px 70px; }

  /* Masthead editorial */
  header.mast {
    padding: 28px 0 16px;
    border-bottom: 3px double var(--line);
    margin-bottom: 4px;
  }
  .mast-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(28px, 4.2vw, 40px);
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: -0.015em;
    color: var(--txt);
  }
  .mast-line {
    margin: 6px 0 0;
    font-size: 12.5px;
    color: var(--txt-mute);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .btn {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--txt-dim);
    border-radius: var(--radius);
    padding: 8px 10px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    transition: border-color .12s ease-out, color .12s ease-out;
  }
  .btn:hover { border-color: var(--txt-dim); color: var(--txt); }
  .tico {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    display: block;
  }
  html[data-theme="light"] .tico.moon { display: none; }
  html[data-theme="dark"] .tico:not(.moon) { display: none; }

  /* Toolbar */
  .toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
    margin: 14px 0 16px;
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    transition: transform .18s ease-out, opacity .18s ease-out;
  }
  .toolbar.hide { transform: translateY(-100%); opacity: 0; pointer-events: none; }

  /* Buscador compacto a la izquierda */
  .search {
    flex: 0 0 210px;
    position: relative;
  }
  .search input {
    width: 100%;
    padding: 7px 11px 7px 32px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--txt);
    font-size: 13px;
    outline: none;
    transition: border-color .15s ease-out, box-shadow .15s ease-out;
  }
  .search input:focus {
    border-color: var(--line-strong);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--line-strong) 20%, transparent);
  }
  .search .ic {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    fill: var(--txt-mute);
    pointer-events: none;
  }

  /* Chips con contadores */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--txt-dim);
    padding: 6px 10px;
    border-radius: var(--radius);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: border-color .12s, color .12s, background .12s, opacity .12s;
  }
  .chip:hover { color: var(--txt); border-color: var(--txt-mute); }
  .chip.on {
    color: var(--on-accent);
    border-color: var(--accent);
    background: var(--accent);
    font-weight: 700;
  }
  .chip.zero { opacity: 0.55; }
  .chip-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }
  .chip-dot.ar { background: var(--ar); }
  .chip-dot.gl { background: var(--global); }
  .chip-dot.dp { background: var(--deporte); }
  .chip-cnt {
    font-size: 11px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    padding: 0 5px;
    border-radius: 10px;
    background: var(--bg-soft);
    color: var(--txt-mute);
    line-height: 1.45;
  }
  .chip.on .chip-cnt {
    background: color-mix(in srgb, var(--on-accent) 18%, transparent);
    color: var(--on-accent);
  }

  /* Selector de edición */
  .ed-wrap {
    margin-left: auto;
    position: relative;
    display: flex;
    align-items: center;
  }
  .cal-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--txt);
    padding: 7px 11px;
    border-radius: var(--radius);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color .12s ease-out;
  }
  .cal-toggle:hover { border-color: var(--txt-mute); }
  .cal-toggle[aria-expanded="true"] { border-color: var(--line-strong); }
  .cal-toggle-lbl {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--txt-mute);
  }
  .cal-toggle-val {
    color: var(--txt);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 170px;
  }
  .cal-toggle-ic { color: var(--txt-mute); font-size: 10px; transition: transform .15s ease-out; }
  .cal-toggle[aria-expanded="true"] .cal-toggle-ic { transform: rotate(180deg); }

  .cal {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    left: auto;
    z-index: 30;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 250px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.15);
  }
  .cal[hidden] { display: none; }
  .cal-todas, .cal-ant {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--txt);
    padding: 7px 10px;
    border-radius: var(--radius);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: border-color .12s, color .12s;
  }
  .cal-todas:hover, .cal-ant:hover { border-color: var(--txt-mute); }
  .cal-todas[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cal-title {
    font-family: var(--serif);
    font-size: 14px;
    font-weight: 700;
    color: var(--txt);
    text-align: center;
    flex: 1;
  }
  .cal-nav {
    width: 28px;
    height: 28px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--txt);
    border-radius: var(--radius);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .cal-nav:hover { border-color: var(--txt-mute); }
  .cal-nav:disabled { opacity: .35; cursor: default; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .cal-dow span {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--txt-mute);
    text-align: center;
    padding: 2px 0;
  }
  .cal-day {
    height: 32px;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    color: var(--txt-dim);
    font-size: 12.5px;
    font-weight: 600;
    cursor: default;
    padding: 0;
  }
  .cal-day.on {
    color: var(--txt);
    border-color: var(--line);
    background: var(--bg-soft);
    cursor: pointer;
    font-weight: 700;
  }
  .cal-day.on:hover {
    background: var(--line);
    color: var(--txt);
  }
  .cal-day.cur {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
    font-weight: 700;
  }
  .cal-day.cur:hover { color: var(--on-accent); background: var(--accent); }

  /* Foco accesible */
  .btn:focus-visible, .chip:focus-visible, .cal-todas:focus-visible, .cal-ant:focus-visible,
  .cal-nav:focus-visible, .cal-day.on:focus-visible, .search input:focus-visible, .src a:focus-visible {
    outline: 2px solid var(--line-strong);
    outline-offset: 2px;
  }

  /* Grid y notas */
  .grid { display: grid; grid-template-columns: 1fr; gap: 0; align-content: start; }
  .band {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
    font-family: var(--serif);
    font-size: clamp(20px, 2.5vw, 24px);
    font-weight: 700;
    color: var(--txt);
    margin: 36px 0 14px;
    padding-top: 12px;
    border-top: 2px solid var(--line-strong);
  }
  .band:first-child { margin-top: 12px; }
  .band-n {
    font-family: var(--sans);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--txt-mute);
    white-space: nowrap;
  }

  /* Card */
  .card {
    border-bottom: 1px solid var(--line);
    padding: 28px 0;
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  .card:has(+ .band), .card:last-child { border-bottom: 0; }
  .c-head { display: grid; gap: 6px; grid-column: 1 / -1; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .tag {
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    line-height: 1.2;
  }
  .tag.ar { color: var(--ar); }
  .tag.global { color: var(--global); }
  .tag.deporte { color: var(--deporte); }
  .card h3 {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(20px, 2.3vw, 24px);
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: -0.015em;
    color: var(--txt);
  }

  .c-main { display: grid; gap: 6px; align-content: start; min-width: 0; }
  .ph {
    aspect-ratio: 16/9;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--bg-soft);
    border: 1px solid var(--line);
  }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph-cap { font-size: 11.5px; line-height: 1.4; color: var(--txt-mute); font-style: italic; }

  .c-side {
    display: grid;
    gap: 10px;
    align-content: start;
    min-width: 0;
    max-width: 82ch;
  }
  .card p {
    margin: 0;
    color: var(--txt-dim);
    font-size: 14.5px;
    line-height: 1.65;
  }
  p b { font-weight: 700; color: var(--txt); }

  .src {
    margin-top: 6px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    display: flex;
    gap: 6px 0;
    flex-wrap: wrap;
    align-items: baseline;
  }
  .src-l { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--txt-mute); margin-right: 6px; }
  .src a { font-size: 12.5px; font-weight: 600; color: var(--txt-dim); text-decoration: none; }
  .src a:hover { color: var(--txt); text-decoration: underline; }
  .src a + a::before { content: " · "; margin: 0 8px; color: var(--txt-mute); text-decoration: none; }

  @media (min-width: 860px) {
    .card:has(.c-main) {
      grid-template-columns: minmax(300px, 38%) 1fr;
      column-gap: 34px;
      row-gap: 14px;
      align-items: start;
    }
  }

  .empty {
    text-align: center;
    padding: 44px 16px;
    color: var(--txt-mute);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    margin: 16px 0;
  }
  .empty h4 { margin: 0 0 6px; color: var(--txt); font-family: var(--serif); font-size: 18px; }
  .empty p { margin: 0 0 14px; font-size: 13.5px; }
  .empty-btn {
    background: var(--accent);
    color: var(--on-accent);
    border: 0;
    border-radius: var(--radius);
    padding: 7px 14px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  mark {
    background: color-mix(in srgb, var(--brand) 28%, transparent);
    color: inherit;
    border-bottom: 1.5px solid var(--brand);
    padding: 0 2px;
    border-radius: 2px;
  }

  footer {
    margin-top: 36px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    color: var(--txt-mute);
    font-size: 12.5px;
    line-height: 1.7;
  }

  @media (max-width: 768px) {
    .wrap { padding: 0 16px 40px; }
    .toolbar { flex-wrap: wrap; gap: 8px; padding: 8px 0; }
    .search { flex: 1 1 100%; order: 2; }
    .chips { order: 1; flex: 1 1 auto; overflow-x: auto; padding-bottom: 2px; }
    .ed-wrap { order: 1; margin-left: auto; }
    .card { padding: 20px 0; gap: 12px; }
    .cal { right: auto; left: 0; }
  }

  @media print {
    body { background: #fff; color: #000; }
    .toolbar, .btn { display: none !important; }
    .card { break-inside: avoid; border: 1px solid #ddd; padding: 16px; margin-bottom: 16px; }
    header.mast { border-color: #ddd; }
    .band { border-color: #000; }
  }
</style>
<script>
  try {
    var t = localStorage.getItem("panel-tema");
    document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
  } catch(e) {
    document.documentElement.setAttribute("data-theme", "light");
  }
</script>

  <header class="mast">

      <div>
        <h1>Panel Automotriz</h1>
        <p class="mast-line">Noticias de la industria automotriz · Argentina y el mundo</p>
      </div>
      <button class="btn" id="themeBtn" title="Cambiar tema claro u oscuro" aria-label="Cambiar tema claro u oscuro">
        <svg class="tico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.3M12 19.1v2.3M4.7 4.7l1.6 1.6M17.7 17.7l1.6 1.6M2.6 12h2.3M19.1 12h2.3M4.7 19.3l1.6-1.6M17.7 6.3l1.6-1.6"/></svg>
        <svg class="tico moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.6 8.6 0 1 0 10.7 10.7z"/></svg>
      </button>

  <div class="toolbar">
    <div class="search">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 1 0 4.55 13.46l4.24 4.24 1.42-1.42-4.24-4.24A7.5 7.5 0 0 0 10.5 3zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/></svg>

    </div>

    <div class="chips" id="chips">
      <button class="chip on" data-f="all" aria-pressed="true">
        Todo <span class="chip-cnt" id="cnt-all">0</span>

      <button class="chip" data-f="deporte" aria-pressed="false">

    <div class="ed-wrap">
      <button type="button" class="cal-toggle" id="cal-toggle" aria-expanded="false" aria-controls="cal-panel">
        <span class="cal-toggle-lbl">Edición</span>
        <span class="cal-toggle-val" id="cal-toggle-val">Archivo</span>
        <span class="cal-toggle-ic" aria-hidden="true">&#9662;</span>
      </button>
      <div class="cal" id="cal-panel" role="group" aria-label="Calendario de ediciones" hidden>

      {

        texto: ["Octubre arrancó con una desaceleración en los patentamientos: al corte del 10 de octubre, último día hábil antes del fin de semana largo, se llevaban registradas poco más de <b>11.000 unidades</b>, un 18% menos que a la misma altura de septiembre. Pero el dato cambia cuando se cuenta por días hábiles: con 7 días contra 8 del mes pasado, el promedio diario baja solo 6,8% intermensual, de 1.686 a 1.571 autos por día.", "La comparación con octubre de 2025 es todavía más alentadora: nominalmente hay una caída del 11,8% (11.043 contra 12.530 autos), pero ajustada por días hábiles el promedio diario sube <b>0,3%</b>, de 1.566 a 1.571, y mantiene la progresión de los últimos meses (en agosto la caída era 19,3% y en septiembre 12,6%). Desde una automotriz comentaron que los usuarios «se dieron cuenta que los autos no van a bajar de precio» y que algunos importadores ya hablan de subas.", "Toyota domina la primera muestra del mes con cuatro modelos entre los 10 más vendidos, y la Volkswagen Amarok vuelve a ser lo más vendido de su marca. Con este ritmo, el sector cree que octubre puede repetir las 50.000 matriculaciones de septiembre, que fue el mejor mes del año después de enero."],

        texto: ["Stellantis volvió a interrumpir la producción del Peugeot 208 en su planta de El Palomar, en medio de la caída de ventas y la retracción de las exportaciones hacia Brasil, el principal mercado externo del modelo. La compañía resolvió aplicar paradas productivas durante distintos tramos del mes para reacomodar el ritmo industrial, reducir el stock acumulado y reorganizar el abastecimiento de piezas frente a una demanda más débil.", "La medida responde a una «adecuación de la dinámica productiva a las condiciones actuales del mercado», según la empresa, que prevé retomar la actividad normal cuando se recupere el nivel de ventas y exportaciones. Las ventas del 208 acumulan una baja cercana al <b>41,5%</b> en lo que va del año, por la debilidad del mercado regional y la creciente competencia en el segmento de compactos.", "En paralelo, la paralización llegó con un esquema de suspensiones acordado con la Unión Obrera Metalúrgica: los trabajadores alcanzados perciben alrededor del <b>70% de sus salarios</b> mientras dure la frenada. La parada se suma a otras registradas en los últimos meses y reaviva la alarma sobre la volatilidad de la industria automotriz local, muy atada al consumo interno y al desempeño de Brasil."],

        texto: ["La Secretaría de Industria y Comercio de la Nación está por abrir la licitación del cupo 2027 de autos híbridos y eléctricos importados libres de arancel, y el cambio central es la segmentación de los valores FOB por tecnología de propulsión. En los cupos de 2025 y 2026 había un único valor de US$ 16.000 en puerto de salida que impactaba por igual a todos los autos; ahora ese tope quedará solo para los microhíbridos (MHEV), los híbridos y híbridos enchufables podrán llegar a <b>US$ 18.000</b> y los eléctricos puros hasta <b>US$ 35.000</b>.", "Con esos valores, los mild-hybrid podrán tener precio final de entre US$ 32.000 y 35.000, los híbridos (HEV y PHEV) treparán hasta unos US$ 40.000 y los 100% eléctricos podrán llegar a vehículos de hasta US$ 70.000 o 75.000. El objetivo declarado es repartir mejor el cupo: entre las convocatorias de 2025 y 2026 se asignaron 100.000 vehículos, ya ingresaron 68.792 de 58 modelos y 29 marcas, y el 80% fueron autos de marcas chinas.", "El total del cupo se mantiene en 50.000 unidades anuales, divididas en dos mitades iguales para fabricantes locales y no fabricantes. Un dato a tener en cuenta: Tesla hoy no está registrada ni en Adefa (fabricantes) ni en Cidoa (importadores oficiales), por lo que su eventual cupo saldría de la mitad de no fabricantes."],

        texto: ["CATL y el fabricante chino Seres Group firmaron el 10 de octubre en Chongqing un acuerdo de cooperación estratégica de largo plazo que profundiza su asociación en torno a la marca AITO. Desde el lanzamiento de AITO, todos los modelos de la marca usan baterías de CATL, con más de <b>1,2 millones</b> de unidades entregadas hasta la fecha, y el acuerdo garantiza el suministro a toda la gama en el largo plazo.", "El eje del acuerdo es la ampliación de capacidad: las dos compañías acelerarán la fase 2 del proyecto \"plant in plant\" dentro de la Super Factory de Seres, con una capacidad anual planificada de 10 a 12 GWh. Al completarse, la capacidad combinada de ambas fases superará los <b>20 GWh</b> por año, en un modelo de producción agrupada pensado para mejorar la eficiencia industrial y la competitividad de costos.", "También incluye cooperación en redes de carga ultrarrápida y servicios de batería con un enfoque de ciclo de vida completo, y expansión conjunta en mercados de Europa, Medio Oriente y Asia Central. El acuerdo refuerza el patrón de las fábricas \"plant in plant\" como respuesta china a la presión de costos de la industria."],

        texto: ["Franco Colapinto fue eliminado en la <b>SQ2</b> de la clasificación Sprint del Gran Premio de Singapur tras una definición ajustada, cuando George Russell mejoró su tiempo en los últimos instantes y lo desplazó de los diez puestos que daban acceso a la SQ3. El argentino había superado la SQ1 con un 1:35.048 y quedó 16.º, a solo 88 milésimas del primer eliminado, Arvid Lindblad.", "Lo más positivo de la jornada fue la cercanía con Pierre Gasly: en la única práctica libre de Alpine, la brecha entre ambos había sido de 945 milésimas, mientras que en la SQ1 se redujo a <b>375 milésimas</b> y en la SQ2 Colapinto se acercó aún más a los registros de su compañero. La mejora confirma la evolución del argentino en un circuito urbano exigente como Marina Bay.", "Del otro lado, Max Verstappen se quedó con la pole de la Sprint, con Russell y Leclerc completando la primera fila. La carrera Sprint se disputó el sábado a las 6 (hora argentina), la clasificación general a las 10, y la carrera principal del domingo 11 a las 9."],

        texto: ["BYD analiza instalar en la Argentina una operación industrial para fabricar <b>baterías de litio</b> y sistemas de almacenamiento de energía, una alternativa que fue comunicada por el canciller Pablo Quirno tras reunirse en Singapur con <b>Stella Li</b>, vicepresidenta ejecutiva de la compañía. Por el momento no se informaron montos, ubicaciones ni fechas para una eventual puesta en marcha, y tampoco se precisó si el proyecto sería fabricación integral de baterías, ensamblaje de componentes u otras etapas de la cadena.", "\"Argentina se posiciona como plataforma para proyectos orientados tanto al mercado doméstico como a la exportación\", sostuvo Quirno, al vincular la perspectiva con las políticas oficiales de promoción de inversiones y desarrollo minero. El proyecto representaría una ampliación de las actividades de BYD en el país, donde hoy comercializa vehículos eléctricos e híbridos enchufables, y abriría la posibilidad de conectar los recursos minerales argentinos con una industria de mayor valor agregado.", "El interés de BYD por el litio argentino ya se había expuesto en abril, cuando Stella Li afirmó que la empresa \"compra mucho litio\" y que quiere incorporarlo a su cadena de suministro siempre que sea competitivo. La empresa, fundada en 1995 como fabricante de baterías, sigue la estrategia de acercar la fabricación a los mercados donde opera para reducir la exposición a barreras comerciales."],

        titulo: "Shacman relanzó su gama en la Expo Auto Chino con la tractora X6000 y el camión liviano L3000",
        texto: ["Grupo Antelo presentó el relanzamiento de Shacman ante el público en la Expo Auto Chino 2026, donde la marca china fue la que lideró el segmento de pesados con dos modelos protagonistas: el <b>X6000</b>, la tractora insignia para la carga pesada y la larga distancia, y el <b>L3000</b>, un camión liviano con características de camión grande. Mariano Visconti, gerente comercial de Shacman Argentina, explicó que la marca llega al país con camiones robustos y componentes de primer nivel para el trabajo exigente del transporte de cargas.", "Shacman es una marca de camiones, buses y vehículos comerciales perteneciente a Shaanxi Automobile Holding Group, una de las principales fabricantes chinas de camiones pesadas, líder en su mercado de origen y proveedora oficial del gobierno chino en vehículos utilitarios pesados. Grupo Antelo tomó la representación comercial y la distribución oficial en junio de 2026 y con esta incorporación suma el transporte pesado a un portafolio que ya incluye a GWM, Changan, JMEV y Mitsubishi, y que este año se amplía también con Deepal y Soueast.", "La marca ya cuenta con una red inicial de concesionarios en distintos puntos del país, desde donde atiende a transportistas, flotas y empresas de logística. En Mendoza el concesionario oficial es Shacman Puebla. Con el X6000 y el L3000 la marca muestra los dos extremos de su propuesta: la tractora de alta exigencia para la ruta y un camión liviano para el trabajo diario."],

        titulo: "Porsche canceló el regreso a combustión del 718 y apuesta todo al eléctrico para 2027",
        texto: ["Porsche confirmó que la próxima generación del 718 volverá en 2027 únicamente con propulsión eléctrica: la producción del 718 Cayman Electric y del 718 Boxster Electric arranca el próximo año y las variantes a gasolina que estaban planeadas para lo más alto de la gama quedaron descartadas. El director ejecutivo Michael Leiters fue tajante ante Automotive News: «Nos quedamos con el auto eléctrico», confirmando que el 718 a combustión no va a existir.", "La decisión cierra un vacío histórico para la marca: los últimos 718 con motores de seis y cuatro cilindros salieron de fábrica en 2025 y desde entonces Porsche no tiene ningún deportivo por debajo del 911, una ausencia particularmente rara para una compañía que nació con el 356. Leiters asumió como CEO en enero de 2026 y al mes siguiente ya contemplaba cancelar el proyecto entero, pero cambió de opinión la primera vez que manejó el 718 Electric, al que ahora describe como un deportivo fantástico.", "La arquitectura es el gran diferencial: como en un dos plazas de motor central la batería no puede ir en el piso, Porsche diseñó el <b>E-Core Architecture</b>, con la batería de tracción repartida en tres módulos sobre dos niveles y una arquitectura eléctrica de 800 voltios, para lograr un reparto de peso equilibrado. Según el vicepresidente de arquitectura Robert Meier, el 55,2% del peso descansa sobre el eje trasero (los 718 térmicos de 2025 estaban en torno al 59%), y la batería integrada aporta rigidez estructural. El modelo será la cuarta línea 100% eléctrica de la marca, después del Taycan, el Macan Electric y el Cayenne Electric."],

        texto: ["Franco Colapinto se mostró optimista antes del Gran Premio de Singapur, la decimoprimera fecha del calendario de Fórmula 1, que se disputa del viernes 9 al domingo 11 de octubre en el circuito urbano de Marina Bay. En la conferencia de prensa previa el argentino fue claro: «Intentaremos recuperarnos. Tenemos un <b>coche muy rápido</b>, así que no es un problema de competitividad», y remarcó que desde el Gran Premio de Países Bajos Alpine «ha dado buenos pasos» con sus actualizaciones técnicas.", "El piloto de Alpine apunta alto para la clasificación: «Tenemos velocidad para aspirar al quinto puesto de la clasificación», dijo, y agregó que quedan muchos puntos en juego y que el equipo este año «se ve más fuerte». En Marina Bay aún no sumó puntos: en 2024, corriendo para Williams, terminó 11.º tras haber ingresado por error al box de Alpine, y en 2025 fue 16.º.", "Este fin de semana el Gran Premio tendrá formato Sprint, lo que le da al argentino doble oportunidad de sumar unidades: la carrera corta el sábado y la principal el domingo, con puntos también en la clasificación especial del viernes. El circuito, con curvas cerradas, numerosas frenadas y pocas rectas largas, se complejiza por las altas temperaturas y la humedad de Singapur."],

        texto: ["MG cerró su participación en la primera edición de la Expo Auto Chino, que se realizó del 2 al 4 de octubre en el predio Costa Salguero de Buenos Aires, con el lanzamiento de dos nuevas herramientas comerciales: el MG Plan de Ahorro y MG Care. El plan se presenta sin interés financiero ni banco intermediario y funciona con un esquema 70/30: el 70% del Valor Móvil se paga con las 84 cuotas del plan y el 30% restante lo aporta el suscriptor al momento de la adjudicación, según las condiciones contractuales vigentes.", "La propuesta está pensada para ampliar las alternativas de acceso a los vehículos de la marca y alcanza de entrada al MG3 Nafta 1.5 Luxury y al MG ZS Nafta 1.5L Comfort, los dos modelos de entrada de la gama en el país. La marca, de origen inglés y perteneciente al gigante asiático SAIC Motor, confirmó además que sigue trabajando en una apertura en la provincia de Mendoza, en camino.", "La gran novedad de producto fue el anticipo del HS Hybrid+, que se estrena en octubre con <b>221 HP</b> y hasta 995 kilómetros de autonomía. El SUV híbrido enchufable suma 340 Nm de torque, asientos calefactados y ventilados, doble pantalla de 12,3 pulgadas y el paquete de asistencia MG Pilot."],

        texto: ["Los autos eléctricos de batería se llevaron el <b>33%</b> de las ventas nuevas en 12 mercados europeos durante septiembre de 2026, un récord que casi duplica el 22% de igual mes del año pasado, según los datos de registro recopilados por Automotive News. En volumen, las ventas de BEV subieron 62% en el mes, y el impulso refleja decisiones de compra tomadas semanas atrás más que un pico repentino de demanda.", "Alemania marcó 34,5% de cuota BEV, casi el doble que hace un año, cuando estuvo en 19%, después de subir de 29% en julio a 32% en agosto. Francia fue aún más lejos, con 65.246 unidades y 41,7% de participación, y los eléctricos pasan allí la mitad del tiempo en el concesionario que los térmicos. España llegó a 18,5% contra 12% en septiembre de 2025; Países Bajos 53%, Bélgica 51% y Suecia 49%, mientras Italia se queda en 8% porque su plan de estímulos se está desvaneciendo.", "El motor del cambio es el precio de lista, sobre todo tras la generalización de las baterías <b>LFP</b> de fosfato de hierro y litio: modelos como el Renault 5, el Twingo, el Kia EV2 o el Cupra Raval viven en el segmento de los menos de 25.000 euros. A ello se suman los nuevos incentivos europeos y la fiscalidad de flotas belga. Los analistas temperan el entusiasmo —aún cuesta definir el punto de inflexión—, pero reconocen que la suma de factores ya funciona como bola de nieve."],

        titulo: "Colapinto afronta el GP de Singapur con Alpine: los horarios del fin de semana en Marina Bay",
        texto: ["Franco Colapinto vuelve a correr este fin de semana, del 9 al 11 de octubre, en el Gran Premio de Singapur, la 17ª fecha de la temporada. El argentino llega después de terminar 13.º en Malasia, tras haber largado 21.º con dos sanciones, y afronta el tercer GP en 20 días con Alpine en su pelea por el quinto puesto del campeonato de constructores.", "<b>Marina Bay</b>, el circuito urbano de 4,927 kilómetros con 19 curvas construido junto a una bahía, es uno de los trazados más exigentes del calendario: combina curvas cerradas, frenadas fuertes y sectores rápidos, con el agregado de un clima extremadamente húmedo. La carrera se disputa en horario nocturno local, sobre 62 vueltas y una distancia total de 305 kilómetros; el récord de vuelta es de Lewis Hamilton, con 1:33.808 en 2025. Colapinto ya corrió dos veces allí: en 2024, con Williams en su debut en la categoría, fue 11.º, y en 2025, con Alpine.", "El fin de semana en horario argentino: el viernes 9 las prácticas libres van de 5:30 a 6:30 y la clasificación de la carrera sprint de 9:30 a 10:14; el sábado 10 la carrera sprint corre de 6 a 7 y la clasificación general de 10 a 11; y la carrera principal es el domingo 11 a las 9."],

        texto: ["El ministro de Gobierno bonaerense, Carlos Bianco, volvió a poner el foco en los indicadores económicos en su conferencia de prensa de este lunes 5 de octubre y sostuvo que los datos de la última semana muestran caída de la actividad, el empleo y el consumo: «se consolida ya la situación de recesión en la economía argentina». Entre las cifras que repasó, la actividad industrial acumuló una caída del 3% interanual entre enero y agosto, con un retroceso de 0,3% en agosto, mientras que la inversión bajó 7,9% interanual acumulada a agosto según la consultora Orlando Ferreres, con la construcción 7,1% abajo y maquinaria y equipo 11,4% abajo.", "En la industria automotriz, Bianco destacó que los patentamientos de septiembre retrocedieron 11,4% y acumulan una baja del 13% en el año, mientras que el <b>69%</b> de los vehículos patentados fueron importados, un dato que, según su análisis, impacta directamente sobre la planta local: «esto impacta muchísimo en la industria local automotriz, que gran parte se localiza en la provincia de Buenos Aires», afirmó.", "El balance se completó con empleo y consumo: la industria perdió 86.500 puestos de trabajo y la construcción acumula 44.600 empleos menos desde diciembre de 2023, y el consumo de los hogares cayó 1,1% interanual en agosto. En confianza, el índice en el Gobierno nacional bajó 5,9% y una encuesta de la UBA mostró que el 53% considera mala o muy mala la situación económica; «todos para abajo, todos mal», resumió el funcionario, que atribuyó los datos «a estrictamente quien está a cargo del Ejecutivo nacional»."],

        texto: ["La Fórmula 1 vuelve este fin de semana a <b>Sepang</b>, casi una década después de su última visita, para disputar allí el Gran Premio de Baréin, que se mudó de su fecha habitual por el conflicto en Oriente Medio. El fin de semana arrancó con Fernando Alonso como protagonista del paddock: el bicampeón mundial anunció el martes 29 de septiembre su renovación con Aston Martin para 2027, lo que será su vigésimocuarta temporada en la categoría, a los 45 años, y reeditará la dupla con Lance Stroll. En la rueda de prensa previa en Sepang dijo que no tiene garantías de que 2027 sea más divertido pero que sigue motivado, y que mientras tenga ese fuego dentro no es momento de parar; Marca incluso lo interpretó como una pista de continuidad hasta 2028. El circuito lo favorece: allí consiguió su primera pole y su primer podio en 2003 y ganó tres veces, en 2005, 2007 y 2012, más que nadie de la parrilla actual.", "El otro foco del fin de semana es la relación entre el campeón Lando Norris y Franco Colapinto después de su accidente en Bakú: Norris llegó a pedir al menos una carrera de suspensión para el argentino, terminó reconociendo que se pasó y ofreció disculpas, mientras Colapinto calificó el episodio de gran error y se disculparó con Pierre Gasly y con el británico. Colapinto largará con cinco puestos de penalización y la carrera se corre el domingo 4 de octubre."],

        texto: ["El Campeonato Mundial de Rally se define este fin de semana en el Rally Italia Sardegna, con sede en Alghero, 307 kilómetros cronometrados y 17 pruebas especiales de tierra. La ronda, la decimotercera y última de la temporada, quedó como única definidora después de que la FIA y WRC Promoter cancelaran el Rally Saudi Arabia del 12 al 15 de noviembre por la situación en la región, una decisión que recortó de 70 a 35 los puntos en disputa y concentró toda la pelea en un solo fin de semana.", "Elfyn Evans, quíctuple subcampeón en los últimos seis años, llega liderando con <b>17 puntos</b> de ventaja sobre su compañero de Toyota Sami Pajari y 21 sobre Oliver Solberg: una tercera victoria de temporada le daría el título, y con 19 puntos ya sería el tercer campeón británico de la historia, después de Colin McRae y Richard Burns. La jornada de apertura del jueves confirmó la pelea a tres. En los duelos de 2,21 kilómetros de la Ittiri Arena, Evans le ganó por 0,4 segundos a Pajari pero fue tercero, a 1,1 de Solberg, que además marcó el mejor tiempo del shakedown.", "Toyota ya se consagró campeón de constructores en Chile, su sexto título consecutivo y décimo en total, y este será el último rally con el GR Yaris Rally1 antes de las nuevas reglas de 2027."],

        texto: ["Volvo Cars comunicó este viernes 2 de octubre a primera hora (08:35 CET) que no cumplirá las previsiones de volumen de ventas y de flujo de caja de efectivo de todo 2026 y que, ante una situación de mercado cada vez más difícil, tampoco publicará nuevas estimaciones a corto plazo por el aumento de la incertidumbre. La compañía atribuye el desvío al empeoramiento del mercado en China y a una recuperación más lenta de lo esperado en Estados Unidos, mientras Europa se mantiene resistente. Según el fabricante sueco, estos desarrollos también tendrán un impacto negativo significativo en las utilidades y el flujo de caja del tercer trimestre, por encima de los vientos en contra ya comunicados en materias primas, tipo de cambio y mayor amortización.", "En el mercado, las acciones cayeron hasta un <b>7,8%</b> en Estocolmo, la mayor caída intradía desde julio, cuando la compañía abandonó su meta de vender más autos este año por la debilidad china. El aviso llega junto a las ventas del tercer trimestre, un 10,7% por debajo del año anterior, también por China y Estados Unidos, y con el plan de giro de 18.000 millones de coronas suecas en plena ejecución: la reducción de 3.000 puestos globales avanza, con unos 1.100 empleados ya desvinculados."],

        texto: ["El ministro de Economía, Luis Caputo, anunció que Toyota Motor destinará <b>US$ 1.340 millones</b> a una nueva planta en Zárate, provincia de Buenos Aires, destinada a fabricar un vehículo completamente eléctrico. Es la mayor inversión de la historia del sector automotor argentino y la primera del país en electrificar su producción a escala industrial: hasta ahora la versión eléctrica de la Hilux se producía solamente en Tailandia. El proyecto exige generar US$ 1.280 millones de exportaciones anuales, de modo que alrededor del setenta por ciento de la producción está orientada al mercado regional, y calcula unos 3.600 empleos durante la etapa de construcción y cerca de 2.600 en operación, entre directos e indirectos.", "Toyota se convierte además en la primera automotriz del mundo en incorporarse al RIGI, el régimen de grandes inversiones creado por la Ley 27.742, un precedente que abre la puerta a otros fabricantes globales. Técnicamente, la Hilux eléctrica monta una batería de 59,2 kWh alojada en el chasis, dos motores eléctricos, uno por eje, tracción integral permanente y 196 CV, con una autonomía declarada cercana a 300 kilómetros en ciclo combinado.", "La primera etapa estará orientada a la minería y a aplicaciones industriales, donde los recorridos previsibles y las bases con carga propia evitan depender de la red pública de cargadores; para el consumidor masivo, la marca hará escala con la versión híbrida."],

        texto: ["BMW presentó la octava generación del Serie 3, el sedán premium más vendido del mundo, y lo hizo sin apostar por una sola tecnología: la gama combina motores de combustión con híbrido ligero de 48 voltios y una variante totalmente eléctrica, el BMW i3, desarrollada bajo la filosofía Neue Klasse. El i3 usa la sexta generación de la tecnología eDrive, con arquitectura eléctrica de 800 voltios, baterías de nueva generación, motores más eficientes y capacidad de carga bidireccional.", "La versión de tope, el i3 50 xDrive, tiene dos motores, tracción integral, 469 CV, acelera de 0 a 100 km/h en 4,7 segundos y con su batería de 108,7 kWh recorre hasta <b>912 kilómetros</b> en el ciclo WLTP, con carga de hasta 400 kW: diez minutos en un cargador rápido suman hasta 423 kilómetros. Debajo, el i3 40 xDrive ofrece 374 CV, una batería de 82,8 kWh y hasta 710 kilómetros, y para 2027 está previsto un i3 M60 xDrive M Performance.", "En el interior aparece el BMW Panoramic iDrive, con pantalla central de 17,9 pulgadas, Head-Up Display 3D y Panoramic Vision. La producción del i3 arrancó en Múnich en agosto, planta que a partir de 2027 fabricará exclusivamente vehículos eléctricos, mientras las versiones de combustión se hacen en Dingolfing. La novedad dinámica es el Drift Moment, una función que envía la potencia al eje trasero para facilitar el deslizamiento controlado."],

        titulo: "El CEO de Ford: para Europa ya es tarde frente a los fabricantes chinos, para Estados Unidos todavía no",
        texto: ["Jim Farley, CEO de Ford, utilizó el Automotive News Congress de Detroit para lanzar una advertencia que es a la vez diagnóstico y estrategia: para <b>Europa</b> ya es tarde contener el avance de los fabricantes chinos, pero Estados Unidos todavía tiene tiempo de decidir con calma. En palabras suyas, es importante tomarse el tiempo para ser cautos, observar lo que pasa en Europa, donde no fue así, y advertir que allí ya es tarde.", "Los números respaldan su lectura: las marcas chinas pasaron de un peso prácticamente nulo en Europa en 2020 al 12% en agosto de 2026 según Dataforce, su cuota global creció cerca del 70% entre 2020 y 2025 según GlobalData, y JATO proyecta más de 1,3 millones de matriculaciones europeas para 2026 contra poco más de 50.000 en 2020.", "La respuesta de Ford es de doble vía: asociarse con empresas chinas donde no tiene propiedad intelectual o donde conviene ser más eficiente en capital, como en la joint venture con Geely en Valencia, donde Geely tiene el 34% y construirá dos de los cuatro modelos eléctricos desde 2028, o con CATL en Michigan; y competirles en directo con su vehículo eléctrico universal que llegará el año próximo con una versión pick-up. Farley argumentó también por seguridad nacional: estos autos se manejan solos, pueden filmar todo, y encontrar el equilibrio adecuado es fundamental. Estados Unidos mantiene aranceles superiores al 100% sobre los autos chinos y una prohibición sobre su software."],

        titulo: "Stellantis para cuatro plantas francesas en octubre: no le faltan pedidos, le faltan baterías de larga autonomía",
        texto: ["Stellantis anunció el martes 29 de septiembre a los representantes del personal que suspenderá la producción entre cinco y quince días en octubre en cuatro de sus plantas francesas: Sochaux, Rennes, Mulhouse y Poissy. En dos de los casos el motivo no es la falta de demanda, sino lo contrario. Sochaux, que fabrica los Peugeot 3008 y 5008, se detiene del 23 al 30 de octubre, y Rennes, que arma el Citroën C5 Aircross, del 22 al 30; ambas por disponibilidad insuficiente de baterías destinadas a las versiones de <b>larga autonomía</b> de sus eléctricos, porque la demanda, especialmente del canal profesional, supera la capacidad de suministro de ACC, la empresa conjunta de Stellantis, Mercedes-Benz y TotalEnergies.", "Mulhouse tiene el paro más largo, del 15 al 30 de octubre, con reducción de equipos desde noviembre, porque los Peugeot 308 y 408 que produce están al final de su ciclo y no admiten esas baterías de alta capacidad; la planta recibirá 400 millones de euros de un paquete de inversión de 1.000 millones anunciado en junio y desde 2029 montará tres modelos nuevos. Poissy se detiene del 19 al 23 por gestión fina de stock.", "En Mulhouse la CGT pidió bajar las cadencias antes que cerrar, y en Rennes la CFDT advirtió sobre el impacto en el poder adquisitivo de los trabajadores en un contexto de combustibles caros, un tema que su delegado calificó de explosivo."],

        texto: ["Stellantis Brasil reveló el 29 de septiembre las primeras imágenes oficiales del Fiat <b>Argo X</b>, el nuevo modelo subcompacto que la marca lanzará en Brasil antes de que termine 2026 y que inaugurará la estrategia de producto faSTLAne para el mercado brasileño. No es la evolución del Argo que se vende hoy: es una versión regional del Grande Panda europeo, con luces cuadradas y alargadas y una X en amarillo neón en el logotipo, que usará la plataforma Smart Car de Stellantis, la misma de los Citroën C3 y Basalt.", "Se fabricará en el complejo de Betim, en Minas Gerais, dentro del plan de inversiones de 32.000 millones de reales que Stellantis tiene hasta 2030 para Sudamérica, de los cuales 14.000 millones van a esa planta, y será el primer modelo completamente nuevo asignado a Betim bajo ese programa.", "La convivencia entre ambos modelos es deliberada: el Argo actual sigue siendo el auto de entrada de la gama y se mantiene a la venta, también en Argentina, mientras el Argo X se ubica un escalón por encima con foco en seguridad. Se esperan dos mecánicas de tres cilindros y un litro, el Firefly de 71 CV con manual de cinco velocidades y el T200 turbo de 116 CV con caja CVT, además de seis airbags y un paquete de asistencia con frenado de emergencia automático, mantenimiento de carril y luces altas automáticas."],

        texto: ["La Asociación de Concesionarios de Automotores de la República Argentina confirma un año de meseta. En junio se patentaron 45.995 vehículos cero kilómetro, un <b>12,8%</b> menos interanual, aunque con un alza del 7,2% contra mayo. Julio fue el mes más duro, con 43.758 unidades y una caída interanual del 30,3%, porque se comparó contra el segundo mejor mes de 2025. Agosto repuntó levemente a 44.415 unidades, pero quedó 19,1% por debajo del mismo mes del año anterior.", "El acumulado de los primeros siete meses alcanza 339.359 unidades frente a 388.680 de 2025. La estructura del mercado cambió más que el volumen: los importados representan hoy cerca del 69% de los patentamientos y los nacionales sólo el 31%, cuando antes de la apertura de importaciones la producción local había llegado al 65%. Las concesionarias arrastran unos 130.000 autos de stock sin vender y el financiamiento es la variable decisiva, porque alrededor del 70% de las operaciones se cierran con crédito.", "Sebastián Beato, de ACARA, prefiere hablar de desaceleración y no de crisis, mientras ADEFA proyecta un cierre de 2026 entre 550.000 y 575.000 unidades, con la expectativa de un rebote fuerte en 2027. En el ranking, la Toyota Hilux de Zárate conserva el primer lugar general y el Fiat Cronos de Córdoba lidera los autos de pasajeros, en tanto que el Ford Territory, importado de China y fabricado por JMC, se convirtió en el importado más vendido del país por primera vez desde la existencia del Mercosur."],

        texto: ["Alpine oficializó el jueves 27 de agosto que Franco Colapinto sigue en el equipo para 2027, en un video con Flavio Briatore y Pierre Gasly en el que el ejecutivo le regala un retrato. El argentino viene cerrando su primera temporada completa en la categoría con 19 puntos en doce Grandes Premios, tras lograr su mejor resultado en Miami, donde el séptimo puesto le dio su mejor posición desde el debut, y un remontaje en Spa que lo llevó al décimo puesto y en el que superó a Gasly y a Lawson en la misma maniobra. También registró su mejor posición de largada en la sesión de clasificación de Monza. El cierre, sin embargo, fue duro.", "En el Gran Premio de <b>Azerbaiyán</b>, en Bakú, el incidente que protagonizó con su propio compañero Gasly y con Lando Norris de McLaren terminó con el retiro de los tres y le costó una penalización de cinco puestos en la grilla para el Gran Premio de Malasia en Sepang, circuito al que la categoría vuelve después de nueve años. Gasly puso como condición pública para sostener la buena relación con su compañero el respeto.", "En la clasificación de Bakú, George Russell tomó la pole con 1:42.526, apenas 0.837 segundos por delante de Charles Leclerc, mientras que el líder del campeonato, Kimi Antonelli, quedó eliminado en la primera ronda tras un incidente en pista. Al cierre de la primera mitad de la temporada, Colapinto ocupa el décimo puesto del campeonato."],

        titulo: "Tesla lanzó el Cybercab en Austin y la NHTSA le abrió una auditoría de seguridad al día siguiente",
        texto: ["El 3 de septiembre Tesla comenzó el despliegue comercial del Cybercab en Austin, Texas, con un lote inicial de unos 45 vehículos. Es el primer producto de la compañía construido desde cero sin posibilidad de retorno a un conductor humano: dos plazas, sin volante, sin pedales de aceleración ni de freno y sin espejos retrovisores, y depende por completo del software de conducción autónoma.", "Horas después, la National Highway Traffic Safety Administration anunció la apertura de un Audit Query, el expediente <b>AQ26002</b>, sobre una población estimada de 1.000 vehículos. La agencia quiere examinar el proceso y los datos técnicos en los que Tesla se basan para autocertificar que el Cybercab cumple con todas las normas federales de seguridad, y agregó que evaluará hasta qué punto esa certificación dependió de considerar que ciertas reglas no aplican a un vehículo sin controles manuales. La autoridad le fijó un plazo para responder antes del 30 de septiembre. El conflicto regulatorio es real: la normativa estadounidense vigente todavía exige controles manuales, y el Departamento de Transporte propuso eliminarlos para vehículos autónomos, pero el cambio no está en vigor.", "El precedente más cercano es Zoox, filial de Amazon, que consiguió una exención temporal de ocho normas de seguridad en julio de 2026 y ya opera viajes de pago en Las Vegas, con permiso para sumar hasta 2.500 vehículos por año durante los dos años siguientes. La auditoría no frena el despliegue de Tesla, pero condiciona cualquier expansión fuera de Austin."],

        num: 5, region: "global", fecha: "9 de julio al 4 de septiembre de 2026",
        titulo: "Volkswagen se prepara para la mayor reestructuración de su historia: hasta 100.000 empleos",
        texto: ["El mayor fabricante de Europa evalúa cerrar cuatro plantas alemanas, en Hanóver, Emden, Zwickau y la de Audi en Neckarsulm, y elevar los recortes de empleo hasta <b>100.000 personas</b>, el doble de los 50.000 ya acordados con el sindicato IG Metall. En términos absolutos sería la reestructuración más grande jamás vista en la industria automotriz, comparable con la de General Motors antes de su quiebra de 2009. El consejo de supervisión aprobó reducir la gama de modelos hasta la mitad y bajar la capacidad productiva de 10 millones a 9 millones de vehículos por año, mientras se proyecta un recorte de inversión cercano al 15%, hasta unos 130.000 millones de euros en cinco años, y la separación de la marca Volkswagen y del negocio de piezas en entidades independientes.", "El origen de la crisis combina el desplome de las ventas en China, una transición hacia el eléctrico tardía, la sobrecapacidad de las plantas alemanas y los aranceles estadounidenses. El beneficio operativo de 2025 cayó un 53%, hasta 8.900 millones de euros, y el margen quedó en 2,8%, el peor desde el Dieselgate.", "El 4 de septiembre se confirmó un pacto de reestructuración y recortes de empleo, después de semanas de protestas masivas en los sitios de producción y de reuniones que los representantes de los trabajadores describieron como desastrosas. El desafío central para la dirección es romper la resistencia de IG Metall y del Estado de Baja Sajonia, segundo accionista de la compañía."],

        titulo: "Fórmula 1: Kimi Antonelli manda con 267 puntos y Mercedes defiende el título en la era de la energía limitada",
        texto: ["El campeonato 2026 vive preso de las nuevas reglas de gestión de energía, y por ahora el balance favorece a Mercedes. Kimi Antonelli lidera la tabla con <b>267 puntos</b>, seguido por su compañero George Russell con 201 y por Lewis Hamilton con 191; Charles Leclerc ocupa el quinto lugar con 155 y Max Verstappen el sexto con 127. El italiano se llevó su primer Gran Premio en casa, en Monza, con una remontada en la que superó a Russell, y ese fin de semana Pierre Gasly logró la pole de su carrera y de Alpine, mientras Colapinto firmaba su mejor posición de largada.", "La novedad de la temporada es el circuito Madring, en Madrid, que hará su debut entre el 11 y el 13 de septiembre; Carlos Sainz, nativo de Madrid y embajador del trazado, pidió paciencia y advirtió que el diseño puede ser tan exigente como Jeddah o Mónaco, y el jefe de Williams James Vowles advirtió que las pruebas de Fórmula 3 sugieren un circuito capaz de romper los monoplazas. La FIA ya decidió acortar las carreras a partir de 2027 para acomodar otro ajuste técnico, y Monza mostró de forma muy clara los límites del actual sistema de energía en las rectas largas.", "En el frente de pilotos, Fernando Alonso dejó sin resolver su continuidad para 2027 pese a la mejora de Aston Martin, y la escudería volvió a respaldar a Honda pese al rendimiento de la nueva motorización."],

const REGION = {
  ar:      { label: "Argentina", cls: "ar" },
  global:  { label: "Global",    cls: "global" },
  deporte: { label: "Competencias",  cls: "deporte" }
};

const el = (t) => document.querySelector(t);
const grid = el("#grid"), stats = el("#stats");
let filtro = "all", query = "", edicionIdx = 0, vistaTodas = false;

/* ---------- Tema claro / oscuro ---------- */
// El tema inicial (claro por defecto, oscuro si había preferencia guardada) se aplica en el <head>, sin parpadeo
el("#themeBtn").onclick = () => {
  const nuevo = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", nuevo);
  try { localStorage.setItem("panel-tema", nuevo); } catch (e) { /* sin storage */ }
};

/* ---------- Resumen de arriba ---------- */
function pintarStats(notas){
  const ar = notas.filter(n => n.region === "ar").length;
  const gl = notas.filter(n => n.region === "global").length;
  const dp = notas.filter(n => n.region === "deporte").length;

  const cAll = el("#cnt-all"), cAr = el("#cnt-ar"), cGl = el("#cnt-gl"), cDp = el("#cnt-dp");
  if (cAll) cAll.textContent = notas.length;
  if (cAr)  cAr.textContent = ar;
  if (cGl)  cGl.textContent = gl;
  if (cDp)  cDp.textContent = dp;

  const bAr = el('.chip[data-f="ar"]');
  const bGl = el('.chip[data-f="global"]');
  const bDp = el('.chip[data-f="deporte"]');
  if (bAr) bAr.classList.toggle("zero", ar === 0);
  if (bGl) bGl.classList.toggle("zero", gl === 0);
  if (bDp) bDp.classList.toggle("zero", dp === 0);
}

/* ---------- Calendario de edición ---------- */
// Mapa fecha ISO -> índice en EDICIONES (sin new Date(string) por UTC-3)
const fechaIdx = {};
EDICIONES.forEach((e, i) => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(e.fecha || "");
  if (m) fechaIdx[e.fecha] = i;
});
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const idxAnt = EDICIONES.findIndex(e => e.fecha === "anteriores");
// Mes visible por defecto: octubre 2026
let calY = 2026, calM = 9; // calM: 0-ene … 9-oct

function etiquetaEd(){
  if (vistaTodas) return "Archivo";
  const ed = EDICIONES[edicionIdx];
  return (ed && (ed.titulo || ed.fecha)) || "—";
}
function pintaCal(){
  const t = el("#cal-title");
  if (t) t.textContent = MESES[calM] + " " + calY;
  const bt = el("#cal-todas");
  if (bt && bt.setAttribute) bt.setAttribute("aria-pressed", vistaTodas);
  const tv = el("#cal-toggle-val");
  if (tv) tv.textContent = etiquetaEd();
  // lunes=0 … domingo=6
  const primero = new Date(calY, calM, 1);
  const dow = (primero.getDay() + 6) % 7;
  const diasMes = new Date(calY, calM + 1, 0).getDate();
  let html = "";
  for (let i = 0; i < dow; i++) html += '<span></span>';
  for (let d = 1; d <= diasMes; d++){
    const iso = calY + "-" + String(calM + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    const has = Object.prototype.hasOwnProperty.call(fechaIdx, iso);
    const ed = has ? EDICIONES[fechaIdx[iso]] : null;
    const cur = has && !vistaTodas && edicionIdx === fechaIdx[iso];
    const label = has
      ? ' aria-label="Ir a la edición del ' + d + ' de ' + MESES[calM] + '"'
      : ' aria-label="' + d + ' de ' + MESES[calM] + ', sin edición" aria-disabled="true"';
    html += '<button type="button" class="cal-day' + (has ? " on" : "") + (cur ? " cur" : "") +
      '" data-iso="' + iso + '"' + (has ? "" : " disabled") + label + '>' + d + "</button>";
  }
  el("#cal-days").innerHTML = html;
  el("#cal-prev").disabled = (calY === 2026 && calM <= 8);
  el("#cal-next").disabled = (calY === 2026 && calM >= 9);
}
function navegaMes(delta){
  calM += delta;
  if (calM < 0){ calM = 11; calY--; }
  if (calM > 11){ calM = 0; calY++; }
  pintaCal();
}
el("#cal-prev").onclick = () => navegaMes(-1);
el("#cal-next").onclick = () => navegaMes(1);
// Toggle: abrir / cerrar panel (al abrir, ir al mes de la edición activa)
el("#cal-toggle").onclick = () => {
  const panel = el("#cal-panel");
  const tg = el("#cal-toggle");
  if (!panel || !tg) return;
  const wasHidden = panel.hasAttribute("hidden");
  if (wasHidden){
    if (!vistaTodas){
      const ed = EDICIONES[edicionIdx];
      const m = ed && /^(\d{4})-(\d{2})-/.exec(ed.fecha || "");
      if (m){ calY = +m[1]; calM = +m[2] - 1; }
    }
    pintaCal();
    panel.removeAttribute("hidden");
  } else {
    panel.setAttribute("hidden", "");
  }
  tg.setAttribute("aria-expanded", wasHidden);
};
// Cerrar al elegir día / Todas / Anteriores
function cierraCal(){
  const panel = el("#cal-panel");
  if (panel && panel.setAttribute) panel.setAttribute("hidden", "");
  const tg = el("#cal-toggle");
  if (tg && tg.setAttribute) tg.setAttribute("aria-expanded", "false");
}
el("#cal-days").addEventListener("click", e => {
  const b = e.target.closest(".cal-day.on");
  if (!b) return;
  const i = fechaIdx[b.dataset.iso];
  if (i === undefined) return;
  vistaTodas = false;
  edicionIdx = i;
  render();
  pintaCal();
  cierraCal();
});
el("#cal-todas").onclick = () => {
  vistaTodas = true;
  render();
  pintaCal();
  cierraCal();
};
el("#cal-ant").onclick = () => {
  if (idxAnt < 0) return;
  vistaTodas = false;
  edicionIdx = idxAnt;
  render();
  pintaCal();
  cierraCal();
};
// Cerrar al hacer clic afuera
document.addEventListener("click", e => {
  const panel = el("#cal-panel");
  if (!panel || !panel.hasAttribute || panel.hasAttribute("hidden")) return;
  if (e.target.closest && e.target.closest(".ed-wrap")) return;
  cierraCal();
});
/* ---------- Render ---------- */
function render(){
  const esc = t => String(t || '').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
  // fmt: escapa todo y habilita SOLO <b>/</b> (negritas de datos)
  const fmt = t => esc(t).replace(/&lt;b&gt;/g, "<b>").replace(/&lt;\/b&gt;/g, "</b>");
  // Resaltado de coincidencias (Ctrl+F): recorre HTML ya escapado ignorando etiquetas
  function highlightHTML(html, term){
    if(!term) return html;
    const re = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    let out = '', i = 0, m;
    while(i < html.length){
      if(html[i] === '<'){
        const end = html.indexOf('>', i);
        if(end === -1){ out += html.slice(i); break; }
        out += html.slice(i, end + 1);
        i = end + 1;
      } else {
        re.lastIndex = 0;
        m = re.exec(html.slice(i));
        if(!m){ out += html.slice(i); break; }
        const start = i + m.index;
        out += html.slice(i, start) + '<mark>' + m[0] + '</mark>';
        i = start + m[0].length;
      }
    }
    return out;
  }
  const q = query.trim().toLowerCase();
  const match = n => {
    if (filtro !== "all" && n.region !== filtro) return false;
    if (!q) return true;
    return ((n.titulo || "") + " " + (Array.isArray(n.texto) ? n.texto.join(" ") : (n.texto || "")).replace(/<\/?b>/g, "") + " " + (n.clave || "") + " " + (n.fuentes ? n.fuentes.map(f => f.t).join(" ") : ""))
      .toLowerCase().includes(q);
  };
  const card = (n, edTitulo) => `
    <article class="card" data-region="${n.region}">
      <div class="c-head">
        <div class="tags">
          <span class="tag ${REGION[n.region]?.cls || 'global'}">${REGION[n.region]?.label || n.region}</span>
        </div>
        <h3>${highlightHTML(esc(n.titulo), q)}</h3>
      </div>
      ${n.img ? `
      <div class="c-main">
        <div class="ph"><img src="${n.img}" alt="" loading="lazy"></div>
        ${n.epigrafe ? `<div class="ph-cap">${highlightHTML(esc(n.epigrafe), q)}</div>` : ""}
      </div>` : ""}
      <div class="c-side">
        ${(Array.isArray(n.texto) ? n.texto : [n.texto]).map(p => `<p>${highlightHTML(fmt(p), q)}</p>`).join("")}
        <div class="src">
          ${(n.fuentes || []).length ? '<span class="src-l">Fuentes:</span>' : ""}
          ${(n.fuentes || []).map(f => `<a href="${f.url}" target="_blank" rel="noopener noreferrer">${esc(f.t)} ↗</a>`).join("")}
        </div>
      </div>
    </article>`;
  const vacio = '<div class="empty"><h4>Sin resultados</h4><p>Probá con otra palabra, quitá el filtro de región o elegí otra edición.</p><button class="empty-btn" id="clear-all">Limpiar filtros</button></div>';

  if (vistaTodas){
    const total = EDICIONES.reduce((s, e) => s + e.notas.length, 0);
    const todas = EDICIONES.reduce((acc, e) => acc.concat(e.notas), []);
    pintarStats(todas);
    el("#foot-fecha").innerHTML = "<b>Vista activa:</b> Archivo completo, " + total + " notas.";
    const grupos = EDICIONES
      .map(e => ({ titulo: e.titulo || e.fecha, notas: e.notas.filter(match) }))
      .filter(g => g.notas.length);
    grid.innerHTML = grupos.length
      ? grupos.map(g =>
          `<h2 class="band">${esc(g.titulo)}<span class="band-n">${g.notas.length} nota${g.notas.length === 1 ? "" : "s"}</span></h2>` +
          g.notas.map(n => card(n, g.titulo)).join("")
        ).join("")
      : `<h2 class="band">Archivo completo<span class="band-n">0 notas</span></h2>` + vacio;
    return;
  }

  const ed = EDICIONES[edicionIdx];
  pintarStats(ed.notas);
  el("#foot-fecha").innerHTML = "<b>Sección activa:</b> " + (ed.titulo || ed.fecha) + ".";
  const lista = ed.notas.filter(match);
  const banda = `<h2 class="band">${esc(ed.titulo || ed.fecha)}<span class="band-n">${lista.length} nota${lista.length === 1 ? "" : "s"}${lista.length !== ed.notas.length ? " de " + ed.notas.length : ""}</span></h2>`;
  grid.innerHTML = lista.length ? banda + lista.map(n => card(n)).join("") : banda + vacio;
}

/* ---------- Controles ---------- */
let qTimer = null;
el("#q").addEventListener("input", e => {
  query = e.target.value;
  clearTimeout(qTimer);
  qTimer = setTimeout(render, 300);
});
el("#grid").addEventListener("click", e => {
  const b = e.target.closest("#clear-all");
  if (!b) return;
  el("#q").value = "";
  query = "";
  document.querySelectorAll(".chip").forEach(c => {
    c.classList.remove("on");
    c.setAttribute("aria-pressed", c === document.querySelector('#chips .chip[data-f="all"]'));
  });
  const firstChip = el('#chips .chip[data-f="all"]');
  if (firstChip){ firstChip.classList.add("on"); firstChip.setAttribute("aria-pressed", "true"); }
  filtro = "all";
  vistaTodas = true;
  render();
  pintaCal();
});
el("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  document.querySelectorAll(".chip").forEach(c => {
    c.classList.remove("on");
    if (c.setAttribute) c.setAttribute("aria-pressed", c === b);
  });
  b.classList.add("on");
  filtro = b.dataset.f;
  render();
});

render();
pintaCal();

/* ---------- Toolbar: se esconde al bajar, vuelve al subir ---------- */
(function(){
  const bar = document.querySelector(".toolbar");
  if (!bar) return;
  let lastY = window.scrollY, ticking = false;
  window.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const y = window.scrollY;
      if (y < 80) bar.classList.remove("hide");          // cerca del tope: siempre visible
      else if (y > lastY + 4) bar.classList.add("hide"); // bajando
      else if (y < lastY - 4) bar.classList.remove("hide"); // subiendo
      lastY = y;
      ticking = false;
    });
  }, { passive: true });
})();

</script>
